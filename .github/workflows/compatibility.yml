name: IDE compatibility
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch minimum supported Community SDK
        run: |
          sdk=$(python3 scripts/fetch_ide.py --code IIC --version 2024.3.2.2 --directory .ci-sdk)
          echo "IDEA_HOME=$sdk" >> "$GITHUB_ENV"
      - name: Build with deprecation warnings treated as errors; run tests
        run: |
          python3 scripts/build.py --test
          python3 -m unittest discover -s scripts/tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: installable-plugin
          path: build/agent-bridge-*.zip
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [minimum, previous-stable, current-stable, upcoming-eap]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: installable-plugin
          path: dist
      - name: Fetch target SDK
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            minimum) sdk=$(python3 scripts/fetch_ide.py --code IIC --version 2024.3.2.2 --directory .ci-sdk) ;;
            previous-stable) sdk=$(python3 scripts/fetch_ide.py --code IIU --version 2026.1.3 --directory .ci-sdk) ;;
            current-stable) sdk=$(python3 scripts/fetch_ide.py --channel release --directory .ci-sdk) ;;
            upcoming-eap) sdk=$(python3 scripts/fetch_ide.py --channel eap --directory .ci-sdk) ;;
          esac
          echo "IDEA_HOME=$sdk" >> "$GITHUB_ENV"
      - name: Download pinned official Plugin Verifier
        run: curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/jetbrains/intellij/plugins/verifier-cli/1.410/verifier-cli-1.410-all.jar -o verifier.jar
      - name: Reject incompatible, deprecated, internal and experimental API usage
        run: |
          python3 scripts/verify_compatibility.py --plugin dist/agent-bridge-*.zip \
            --verifier verifier.jar --ide "$IDEA_HOME" --runtime "$IDEA_HOME/jbr" \
            --reports build/verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.target }}
          path: build/verification
          if-no-files-found: warn
