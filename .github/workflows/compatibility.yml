name: IDE compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload this version to JetBrains Marketplace after verification'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version_changed: ${{ steps.release_version.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check whether the plugin version changed
        id: release_version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PREVIOUS_COMMIT: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          descriptor = 'src/main/resources/META-INF/plugin.xml'
          current = ET.parse(descriptor).getroot().findtext('version')
          if not current:
              raise SystemExit('Plugin version is missing')
          previous_commit = os.environ['PREVIOUS_COMMIT']
          previous = subprocess.run(['git', 'show', f'{previous_commit}:{descriptor}'],
                                    capture_output=True, text=True, check=True)
          old = ET.fromstring(previous.stdout).findtext('version')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'changed={str(old != current).lower()}\n')
          print(f'Plugin version: {old} -> {current}')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch minimum supported Community SDK
        run: |
          sdk=$(python3 scripts/fetch_ide.py --code IIC --version 2024.3.2.2 --directory .ci-sdk)
          echo "IDEA_HOME=$sdk" >> "$GITHUB_ENV"
      - name: Build with deprecation warnings treated as errors; run tests
        run: |
          python3 scripts/build.py --test
          python3 -m unittest discover -s scripts/tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: installable-plugin
          path: build/agent-bridge-*.zip
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [minimum, previous-stable, current-stable, upcoming-eap]
    continue-on-error: ${{ matrix.target == 'upcoming-eap' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: installable-plugin
          path: dist
      - name: Fetch target SDK
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            minimum) sdk=$(python3 scripts/fetch_ide.py --code IIC --version 2024.3.2.2 --directory .ci-sdk) ;;
            previous-stable) sdk=$(python3 scripts/fetch_ide.py --code IIU --version 2026.1.3 --directory .ci-sdk) ;;
            current-stable) sdk=$(python3 scripts/fetch_ide.py --channel release --directory .ci-sdk) ;;
            upcoming-eap) sdk=$(python3 scripts/fetch_ide.py --channel eap --directory .ci-sdk) ;;
          esac
          echo "IDEA_HOME=$sdk" >> "$GITHUB_ENV"
      - name: Download pinned official Plugin Verifier
        run: curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/jetbrains/intellij/plugins/verifier-cli/1.410/verifier-cli-1.410-all.jar -o verifier.jar
      - name: Reject incompatible, deprecated, internal and experimental API usage
        run: |
          python3 scripts/verify_compatibility.py --plugin dist/agent-bridge-*.zip \
            --verifier verifier.jar --ide "$IDEA_HOME" --runtime "$IDEA_HOME/jbr" \
            --reports build/verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.target }}
          path: build/verification
          if-no-files-found: warn

  publish:
    needs: [build, verify]
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.build.outputs.version_changed == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: jetbrains-marketplace
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installable-plugin
          path: dist
      - name: Check archive and upload to JetBrains Marketplace
        env:
          MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          if [[ -z "$MARKETPLACE_TOKEN" ]]; then
            echo 'Missing JETBRAINS_MARKETPLACE_TOKEN repository secret' >&2
            exit 1
          fi
          shopt -s nullglob
          archives=(dist/agent-bridge-*.zip)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo 'Expected exactly one installable plugin ZIP' >&2
            exit 1
          fi
          python3 - "${archives[0]}" <<'PY'
          import io
          import sys
          import xml.etree.ElementTree as ET
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              jars = [name for name in archive.namelist() if name.endswith('.jar')]
              if len(jars) != 1:
                  raise SystemExit('Expected one plugin JAR')
              with zipfile.ZipFile(io.BytesIO(archive.read(jars[0]))) as jar:
                  root = ET.fromstring(jar.read('META-INF/plugin.xml'))
          plugin_id, version = root.findtext('id'), root.findtext('version')
          if plugin_id != 'io.github.shbhmrzd.agentbridge' or not version:
              raise SystemExit('Unexpected plugin ID or missing version')
          if sys.argv[1] != f'dist/agent-bridge-{version}.zip':
              raise SystemExit('Archive filename does not match plugin version')
          print(f'Uploading {plugin_id} version {version}')
          PY
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $MARKETPLACE_TOKEN" \
            --form 'pluginId=34567' --form "file=@${archives[0]}" \
            --output marketplace-response.json \
            https://plugins.jetbrains.com/api/updates/upload
          echo 'Marketplace upload accepted; JetBrains review is still required.'
